<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Step Into Style</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

    <div class="container">

        <div class="text-box">

            <div class="top-bar">

                <h2>SOLEA</h2>

                <div class="top-icons">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <i class="fa-solid fa-address-book"></i>
                </div>

            </div>

            <p class="new">NEW ARRIVAL</p>

            <h1>
                STEP INTO
                <span>STYLE</span>
            </h1>

            <div class="line"></div>

            <p class="description">
                Comfort that keeps up<br>
                with your every move.
            </p>

    
            <div class="price">
                <span class="new-price">$150</span>
                <span class="old-price">$250</span>
            </div>

            <button>
                SHOP NOW
                <i class="fa-solid fa-arrow-right"></i>
            </button>


            
            <div class="colors">

                <p>COLORS</p>

                <div class="color-list">

                    <div class="color-item">
                        <span class="circle pink"></span>
                        <small>PINK</small>
                    </div>

                    <div class="color-item">
                        <span class="circle black"></span>
                        <small>BLACK</small>
                    </div>

                    <div class="color-item">
                        <span class="circle white"></span>
                        <small>WHITE</small>
                    </div>

                </div>

            </div>

        </div>


        <div class="shoe-box">

            <div class="pink-glow"></div>

            <img src="image/shoes.png"
            alt="shoes.png">

            <div class="shadow"></div>

        </div>

    </div>

</body>

</html>
